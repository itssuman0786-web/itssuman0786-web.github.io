<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#090913;--ink:#f4f2ff;--muted:#a5a2c4;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.045);--a:#a78bfa;--b:#f472b6;--grad:linear-gradient(120deg,var(--a),var(--b));--hh:68px;color-scheme:dark;
--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:var(--hh)}
body{background:var(--bg);color:var(--ink);font:17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.38;pointer-events:none}
body::before{top:-20vmax;left:-15vmax;background:radial-gradient(circle,#6d4aff,transparent 65%);animation:drift 18s ease-in-out infinite alternate}
body::after{bottom:-25vmax;right:-15vmax;background:radial-gradient(circle,#ec4899,transparent 65%);animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:4px}
.wrap{width:min(1080px,100% - 40px);margin-inline:auto}
section{padding:88px 0}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.15;letter-spacing:-.01em}
h2{font-size:clamp(2rem,4.5vw,2.9rem);margin-bottom:12px;display:inline-block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);max-width:56ch;margin-bottom:40px}
.progress{position:fixed;top:0;left:0;right:0;height:3px;background:var(--grad);transform-origin:0 50%;transform:scaleX(0);z-index:30}

header{position:sticky;top:0;z-index:20;height:var(--hh);background:rgba(9,9,19,.65);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-size:1.3rem}
nav{display:flex;gap:28px}
nav a{color:var(--muted);font-size:.95rem;padding:6px 0;background:var(--grad) 0 100%/0 2px no-repeat;transition:color .2s,background-size .3s}
nav a:hover,nav a.active{color:var(--ink);background-size:100% 2px}
.menu-btn{display:none;width:44px;height:44px;background:none;border:0;cursor:pointer;position:relative}
.menu-btn span,.menu-btn::before,.menu-btn::after{content:"";position:absolute;left:11px;right:11px;height:2px;background:var(--ink);transition:transform .25s,opacity .25s}
.menu-btn::before{top:15px}.menu-btn span{top:21px}.menu-btn::after{top:27px}
.menu-open .menu-btn::before{transform:translateY(6px) rotate(45deg)}
.menu-open .menu-btn span{opacity:0}
.menu-open .menu-btn::after{transform:translateY(-6px) rotate(-45deg)}

.hero{padding:64px 0 88px}
.hero .wrap{display:grid;gap:56px;align-items:center}
.hero-text>*{animation:rise .8s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.greeting{color:var(--b);font-weight:600;margin-bottom:10px}
h1{font-size:clamp(3rem,9vw,5.8rem);margin-bottom:12px;background:linear-gradient(110deg,#fff,var(--a),var(--b),#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s both,shine 7s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.role{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,3vw,1.6rem);color:var(--muted);margin-bottom:10px}
.typed-line{font-size:clamp(1.1rem,2.6vw,1.4rem);margin-bottom:22px;min-height:1.7em}
.typed{color:var(--a);font-weight:600}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--b);margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bio{max-width:52ch;margin-bottom:28px;color:#d6d3ee}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px}
.chips li{list-style:none;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.9rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:13px 28px;border-radius:999px;font-weight:600;border:1.5px solid var(--a);transition:transform .25s,box-shadow .25s,background .25s}
.btn.primary{background:var(--grad);border-color:transparent;color:#140d24}
.btn.primary:hover{box-shadow:0 10px 34px rgba(167,139,250,.5)}
.btn.ghost:hover{background:rgba(167,139,250,.15)}
.btn:hover{transform:translateY(-3px)}
.portrait-box{position:relative;justify-self:center;width:min(330px,82%);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.portrait{aspect-ratio:3/4;padding:4px;border-radius:999px 999px 28px 28px;background:conic-gradient(from var(--ang),var(--a),var(--b),#38bdf8,var(--a));animation:spin 6s linear infinite;box-shadow:0 0 80px rgba(167,139,250,.35);transition:transform .15s}
@keyframes spin{to{--ang:360deg}}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:996px 996px 24px 24px;display:block}
.badge{position:absolute;left:-18px;bottom:36px;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(20,18,38,.75);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:.88rem}
.badge i{width:9px;height:9px;border-radius:50%;background:#4ade80;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}100%{box-shadow:0 0 0 12px transparent}}

.marquee{overflow:hidden;border-block:1px solid var(--line);padding:18px 0;background:rgba(255,255,255,.02);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marquee-track{display:flex;width:max-content;animation:slide 32s linear infinite}
.marquee-track span{font-family:var(--serif);font-style:italic;font-size:1.6rem;color:var(--muted);white-space:nowrap;margin-right:48px}
.marquee-track span::after{content:"\2726";margin-left:48px;color:var(--b);font-style:normal}
@keyframes slide{to{transform:translateX(-50%)}}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
.glow,.contact-item{position:relative;display:block;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:26px;transition:transform .3s,border-color .3s,opacity .7s}
.glow::before,.contact-item::before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(167,139,250,.24),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.glow:hover,.contact-item:hover{transform:translateY(-5px);border-color:rgba(167,139,250,.55)}
.glow:hover::before,.contact-item:hover::before{opacity:1}
.skills-grid,.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.cards{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.skill h3{font-size:1.2rem;margin-bottom:6px}
.skill p{color:var(--muted);font-size:.93rem;line-height:1.5}
.card{display:flex;flex-direction:column;gap:12px;min-height:250px}
.card h3{font-size:1.5rem}
.card p{color:var(--muted);flex:1}
.card .src{font-weight:600;color:var(--a)}
.card .src::after{content:" \2192";display:inline-block;transition:transform .3s}
.card:hover .src::after{transform:translateX(8px)}

.contact-main{display:inline-block;font-family:var(--serif);font-size:clamp(1.4rem,5vw,2.9rem);margin-bottom:36px;word-break:break-all;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;transition:filter .3s}
.contact-main:hover{filter:brightness(1.25)}
.contact-list{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.contact-item{padding:18px 22px}
.contact-item span{display:block;color:var(--muted);font-size:.85rem}
.contact-item strong{font-weight:600;word-break:break-word}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:.9rem;text-align:center}

@media(min-width:860px){.hero .wrap{grid-template-columns:1.3fr .7fr}}
@media(max-width:700px){
.menu-btn{display:block}
nav{position:absolute;top:var(--hh);left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);max-height:0;overflow:hidden;visibility:hidden;transition:max-height .3s,visibility .3s}
.menu-open nav{max-height:460px;visibility:visible}
nav a{padding:16px 20px;background:none}
section{padding:64px 0}
.badge{left:0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.reveal{opacity:1;transform:none}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;padding:56px 0 0}
.stat strong{display:block;font-family:var(--serif);font-size:clamp(2.4rem,6vw,3.6rem);font-weight:400;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:.95rem}
.more{margin-top:32px}
.timeline{position:relative;padding-left:30px;border-left:2px solid transparent;border-image:linear-gradient(var(--a),var(--b)) 1}
.job{position:relative}
.dot{position:absolute;left:-38px;top:32px;width:14px;height:14px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 5px rgba(167,139,250,.22)}
.job h3{font-size:1.7rem}
.company{color:var(--b);font-weight:600;margin-bottom:10px}
.summary{color:#d6d3ee;max-width:62ch}
.points{list-style:none;padding:0;margin-top:14px;display:grid;gap:9px}
.points li{position:relative;padding-left:22px;color:#d6d3ee;font-size:.97rem}
.points li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--grad)}
.work-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.work{display:flex;flex-direction:column;gap:12px}
.work .tag{align-self:flex-start;font-size:.8rem;padding:3px 12px;border-radius:999px;border:1px solid rgba(167,139,250,.5);color:var(--a)}
.work h3{font-size:1.4rem}
.work p{color:var(--muted)}
.work .points{margin-top:0}
blockquote{margin-top:auto;border-left:3px solid var(--b);padding:4px 0 4px 14px;font-family:var(--serif);font-style:italic;color:#e6e3fb}
@media(max-width:700px){.timeline{padding-left:22px}.dot{left:-30px}.work-grid{grid-template-columns:1fr}}

.portrait{padding:0;background:none;animation:none;border-radius:26px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 60px rgba(167,139,250,.22)}
.portrait img{border-radius:0}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);transform:translateX(-120%);transition:transform .9s;pointer-events:none}
.portrait:hover::after{transform:translateX(120%)}
.portrait-box::before{content:"";position:absolute;inset:18px -18px -18px 18px;border-radius:26px;border:1.5px solid var(--a);opacity:.55;z-index:-1}
.badge{animation:float 5s ease-in-out infinite}
.badge.b1{left:auto;right:-14px;bottom:auto;top:44px;animation-delay:-2s}
.cursor-glow{position:fixed;left:0;top:0;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.15),transparent 65%);pointer-events:none;z-index:-1;transition:transform .15s linear}
@media(pointer:coarse){.cursor-glow{display:none}}
.folder-tabs{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:22px;padding-top:14px}
.folder{position:relative;flex:1 1 260px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;background:var(--glass);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:22px 24px;transition:transform .3s,border-color .3s,background .3s,box-shadow .3s}
.folder::before{content:"";position:absolute;left:-1px;top:-14px;width:40%;max-width:130px;height:14px;background:inherit;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;transition:border-color .3s}
.folder:hover{transform:translateY(-3px)}
.folder.active{border-color:var(--a);background:linear-gradient(135deg,rgba(167,139,250,.24),rgba(244,114,182,.14));box-shadow:0 14px 40px rgba(167,139,250,.25);transform:translateY(-3px)}
.folder.active::before{border-color:var(--a)}
.folder-name{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.2}
.folder-count{color:var(--muted);font-size:.92rem}
.folder-desc{color:var(--muted);max-width:62ch;margin-bottom:18px}
.subfolders{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.sub{font:inherit;font-size:.9rem;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.sub:hover,.sub.active{color:var(--ink);border-color:var(--a)}
.sub.active{background:rgba(167,139,250,.2)}
.folder-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.swap>*{animation:rise .5s both}
.card .tag{align-self:flex-start;font-size:.8rem;padding:3px 12px;border-radius:999px;border:1px solid rgba(167,139,250,.5);color:var(--a)}
.card .points{margin-top:0}
.card .src{margin-top:auto}
.open-btn{align-self:flex-start;margin-top:auto;font:inherit;font-weight:600;color:var(--a);background:none;border:1.5px solid var(--a);border-radius:999px;padding:8px 20px;cursor:pointer;transition:background .25s,transform .25s}
.open-btn:hover{background:rgba(167,139,250,.18);transform:translateY(-2px)}
.viewer{width:min(720px,calc(100% - 28px));max-height:86vh;margin:auto;padding:0;border:1px solid var(--line);border-radius:20px;background:#14122a;color:var(--ink);overflow:hidden}
.viewer[open]{display:flex;flex-direction:column;animation:rise .35s both}
.viewer::backdrop{background:rgba(5,5,12,.72);backdrop-filter:blur(6px)}
.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line)}
.viewer-head h3{font-size:1.3rem}
.viewer-close{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;transition:border-color .2s,transform .2s}
.viewer-close:hover{border-color:var(--b);transform:rotate(90deg)}
.viewer-body{padding:6px 24px 28px;overflow:auto}
.viewer-body h4{font-family:var(--serif);font-weight:400;font-size:1.2rem;margin:24px 0 6px;color:var(--a)}
.viewer-body h5{font-size:1rem;margin:16px 0 2px}
.viewer-body p{color:#d6d3ee;margin-top:6px;max-width:62ch}
.viewer-body .points{margin-top:8px}
@media(max-width:700px){.badge.b1{right:0}.folder-grid{grid-template-columns:1fr}}
.portrait::after{display:none}
.portrait{transform:none!important}
</style>
</head>

    intro: "Have a topic, a project or an idea? Send me a message.",
    email: "itssuman0786@gmail.com",
    phone: "9888105407",
    phoneHref: "tel:+919888105407",
    items: [
      { label: "Phone", value: "9888105407", href: "tel:+919888105407" },
      { label: "Medium", value: "@itssuman0786", href: "https://medium.com/@itssuman0786" },
      { label: "LinkedIn", value: "Suman Lata", href: "https://www.linkedin.com/in/suman-lata-10a42643b" }
    ]
  },
  footer: "\u00A9 {year} Suman Lata. All rights reserved."
};

/* ===== HELPERS ===== */
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === null) continue;
    if (key === "text") node.textContent = value;
    else if (key === "class") node.className = value;
    else node.setAttribute(key, value);
  }
  [].concat(children).forEach(c => c && node.appendChild(c));
  return node;
}
const external = href => href.startsWith("http") ? { target: "_blank", rel: "noopener noreferrer" } : {};
const link = (props, children) => el("a", { ...external(props.href || ""), ...props }, children);

/* ===== RENDER FUNCTIONS ===== */
function renderHead(d) {
  document.title = d.meta.title;
  document.documentElement.lang = d.meta.language;
  const m = document.head.appendChild(el("meta", { name: "description", content: d.meta.description }));
  return m;
}

function renderHeader(d) {
  const nav = el("nav", { id: "site-nav" }, d.nav.map(n =>
    el("a", { href: "#" + n.target, "data-target": n.target, text: n.label })));
  const btn = el("button", { class: "menu-btn", "aria-label": d.menuLabel, "aria-controls": "site-nav", "aria-expanded": "false" }, el("span"));
  const brand = el("a", { class: "brand", href: "#about", "data-target": "about", text: d.name });
  return el("header", {}, el("div", { class: "wrap" }, [brand, nav, btn]));
}

function renderHero(d) {
  const h = d.hero;
  const kids = [
    el("p", { class: "greeting", text: h.greeting }),
    el("h1", { text: d.name }),
    el("p", { class: "role", text: d.role }),
    el("p", { class: "typed-line" }, [el("span", { text: h.typedPrefix + " " }), el("span", { class: "typed" }), el("span", { class: "caret" })]),
    el("p", { class: "bio", text: h.bio }),
    el("ul", { class: "chips" }, h.highlights.map(t => el("li", { text: t }))),
    el("div", { class: "actions" }, [
      el("a", { class: "btn primary", href: "#" + h.primaryCta.target, "data-target": h.primaryCta.target, text: h.primaryCta.label }),
      el("a", { class: "btn ghost", href: "#" + h.secondaryCta.target, "data-target": h.secondaryCta.target, text: h.secondaryCta.label })
    ])
  ];
  kids.forEach((k, i) => { k.style.animationDelay = i * 90 + "ms"; });
  const text = el("div", { class: "hero-text" }, kids);
  const portrait = el("div", { class: "portrait-box" }, [
    el("div", { class: "portrait" }, el("img", { src: d.photo, alt: d.photoAlt })),
    
  ]);
  return el("section", { id: "about", class: "hero" }, el("div", { class: "wrap" }, [text, portrait]));
}

function sectionShell(id, s, body) {
  return el("section", { id }, el("div", { class: "wrap" }, [
    el("h2", { text: s.heading }),
    el("p", { class: "lead", text: s.intro }),
    body
  ]));
}

function renderMarquee(d) {
  const names = d.skills.items.map(s => s.name);
  const spans = [...names, ...names].map(n => el("span", { text: n }));
  return el("div", { class: "marquee", "aria-hidden": "true" }, el("div", { class: "marquee-track" }, spans));
}

function renderSkills(d) {
  const grid = el("div", { class: "skills-grid" }, d.skills.items.map(s =>
    el("div", { class: "skill glow" }, [el("h3", { text: s.name }), el("p", { text: s.detail })])));
  return sectionShell("skills", d.skills, grid);
}

function countFolder(f) { return f.groups.reduce((n, g) => n + g.items.length, 0); }

function renderBody(lines) {
  const frag = document.createDocumentFragment();
  let ul = null;
  lines.forEach(t => {
    if (t.startsWith("- ")) {
      if (!ul) { ul = el("ul", { class: "points" }); frag.appendChild(ul); }
      ul.appendChild(el("li", { text: t.slice(2) }));
      return;
    }
    ul = null;
    if (t.startsWith("## ")) frag.appendChild(el("h4", { text: t.slice(3) }));
    else if (t.startsWith("### ")) frag.appendChild(el("h5", { text: t.slice(4) }));
    else frag.appendChild(el("p", { text: t }));
  });
  return frag;
}

function workCard(f, w, viewer) {
  const kids = [];
  if (w.tag) kids.push(el("span", { class: "tag", text: w.tag }));
  kids.push(el("h3", { text: w.title }), el("p", { text: w.description }));
  if (w.points) kids.push(el("ul", { class: "points" }, w.points.map(t => el("li", { text: t }))));
  if (w.url) {
    kids.push(el("span", { class: "src", text: f.readArticle }));
    return link({ class: "card glow", href: w.url }, kids);
  }
  if (w.body) {
    const btn = el("button", { type: "button", class: "open-btn", text: f.readPiece });
    btn.addEventListener("click", () => viewer.open(w));
    kids.push(btn);
  }
  return el("div", { class: "card glow" }, kids);
}

function createViewer(f) {
  const title = el("h3");
  const close = el("button", { type: "button", class: "viewer-close", "aria-label": f.closeLabel, text: "\u00D7" });
  const body = el("div", { class: "viewer-body" });
  const dlg = el("dialog", { class: "viewer" }, [el("div", { class: "viewer-head" }, [title, close]), body]);
  close.addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.open = w => {
    title.textContent = w.title;
    body.replaceChildren(renderBody(w.body));
    body.scrollTop = 0;
    dlg.showModal();
  };
  return dlg;
}

function renderFolders(d) {
  const f = d.folders;
  const state = { folder: 0, group: -1 };
  const viewer = createViewer(f);
  const tabs = el("div", { class: "folder-tabs", role: "tablist" });
  const desc = el("p", { class: "folder-desc" });
  const subs = el("div", { class: "subfolders" });
  const grid = el("div", { class: "folder-grid" });

  function paint() {
    const cur = f.items[state.folder];
    [...tabs.children].forEach((b, i) => {
      b.classList.toggle("active", i === state.folder);
      b.setAttribute("aria-selected", String(i === state.folder));
    });
    desc.textContent = cur.description;
    subs.replaceChildren();
    if (cur.groups.length > 1) {
      [f.allLabel, ...cur.groups.map(g => g.name)].forEach((name, i) => {
        const b = el("button", { type: "button", class: "sub" + (state.group === i - 1 ? " active" : ""), text: name });
        b.addEventListener("click", () => { state.group = i - 1; paint(); });
        subs.appendChild(b);
      });
    }
    const items = cur.groups.filter((g, i) => state.group < 0 || i === state.group).flatMap(g => g.items);
    const cards = items.map((w, i) => {
      const c = workCard(f, w, viewer);
      c.style.animationDelay = i * 70 + "ms";
      return c;
    });
    grid.replaceChildren(...cards);
    grid.classList.remove("swap");
    void grid.offsetWidth;
    grid.classList.add("swap");
  }

  f.items.forEach((cur, i) => {
    const b = el("button", { type: "button", class: "folder", role: "tab" }, [
      el("span", { class: "folder-name", text: cur.name }),
      el("span", { class: "folder-count", text: countFolder(cur) + " " + cur.countLabel })
    ]);
    b.addEventListener("click", () => { state.folder = i; state.group = -1; paint(); });
    tabs.appendChild(b);
  });
  paint();
  const more = el("div", { class: "more" }, link({ class: "btn ghost", href: f.viewAll.url, text: f.viewAll.label }));
  return sectionShell("portfolio", f, el("div", {}, [tabs, desc, subs, grid, more, viewer]));
}

function renderStats(d) {
  const stats = d.stats.map(s => el("div", { class: "stat" }, [
    el("strong", { text: String(s.value !== undefined ? s.value : countFolder(d.folders.items[s.folder])) }),
    el("span", { text: s.label })
  ]));
  return el("div", { class: "wrap" }, el("div", { class: "stats" }, stats));
}

function renderExperience(d) {
  const jobs = d.experience.items.map(j => el("div", { class: "job" }, [
    el("i", { class: "dot" }),
    el("div", { class: "glow" }, [
      el("h3", { text: j.role }),
      el("p", { class: "company", text: j.company }),
      el("p", { class: "summary", text: j.summary }),
      el("ul", { class: "points" }, j.points.map(t => el("li", { text: t })))
    ])
  ]));
  return sectionShell("experience", d.experience, el("div", { class: "timeline" }, jobs));
}

function renderContact(d) {
  const c = d.contact;
  const body = el("div", {}, [
    link({ class: "contact-main", href: "mailto:" + c.email, text: c.email }),
    el("div", { class: "contact-list" }, c.items.map(i =>
      link({ class: "contact-item", href: i.href }, [el("span", { text: i.label }), el("strong", { text: i.value })])))
  ]);
  return sectionShell("contact", c, body);
}

function renderFooter(d) {
  const text = d.footer.replace("{year}", new Date().getFullYear());
  return el("footer", {}, el("div", { class: "wrap" }, el("p", { text })));
}

/* ===== BEHAVIOUR ===== */
const reduceMotion = matchMedia("(prefers-reduced-motion:reduce)").matches;

function initNavigation() {
  const header = document.querySelector("header");
  const btn = header.querySelector(".menu-btn");
  const setMenu = open => {
    header.classList.toggle("menu-open", open);
    btn.setAttribute("aria-expanded", String(open));
  };
  btn.addEventListener("click", () => setMenu(!header.classList.contains("menu-open")));
  document.addEventListener("click", e => {
    const a = e.target.closest("a[data-target]");
    const target = a && document.getElementById(a.dataset.target);
    if (!target) return;
    e.preventDefault();
    setMenu(false);
    target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    history.replaceState(null, "", "#" + a.dataset.target);
  });
  const links = [...header.querySelectorAll("nav a")];
  const spy = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) links.forEach(l => l.classList.toggle("active", l.dataset.target === en.target.id));
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll("main > section").forEach(s => spy.observe(s));
}

function initTyping(d) {
  const out = document.querySelector(".typed");
  const words = d.hero.typedWords;
  if (!out || !words.length) return;
  if (reduceMotion) { out.textContent = words[0]; return; }
  let w = 0, c = 0, erasing = false;
  (function tick() {
    const word = words[w];
    c += erasing ? -1 : 1;
    out.textContent = word.slice(0, c);
    let delay = erasing ? 30 : 70;
    if (!erasing && c === word.length) { erasing = true; delay = 1600; }
    else if (erasing && c === 0) { erasing = false; w = (w + 1) % words.length; delay = 350; }
    setTimeout(tick, delay);
  })();
}

function initEffects() {
  document.addEventListener("pointermove", e => {
    const card = e.target.closest(".glow, .contact-item");
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", e.clientX - r.left + "px");
    card.style.setProperty("--my", e.clientY - r.top + "px");
  });
  const portrait = document.querySelector(".portrait");
  if (portrait && !reduceMotion) {
    portrait.addEventListener("pointermove", e => {
      const r = portrait.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      portrait.style.transform = `perspective(800px) rotateY(${x * 16}deg) rotateX(${-y * 16}deg)`;
    });
    portrait.addEventListener("pointerleave", () => { portrait.style.transform = ""; });
  }
  const glow = document.querySelector(".cursor-glow");
  document.addEventListener("pointermove", e => { glow.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; });
  const bar = document.querySelector(".progress");
  const onScroll = () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
  };
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();
}

function initReveal() {
  const items = document.querySelectorAll("main h2, .lead, .stat, .skill, .job, .folder-tabs, .contact-main, .contact-item");
  items.forEach((n, i) => { n.classList.add("reveal"); n.style.transitionDelay = (i % 4) * 80 + "ms"; });
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add("in");
      setTimeout(() => { en.target.style.transitionDelay = ""; }, 1200);
      io.unobserve(en.target);
    });
  }, { threshold: .15 });
  items.forEach(n => io.observe(n));
}

function initCounters() {
  document.querySelectorAll(".stat strong").forEach(n => {
    const end = parseInt(n.textContent, 10);
    if (isNaN(end) || reduceMotion) return;
    n.textContent = "0";
    const io = new IntersectionObserver(([en]) => {
      if (!en.isIntersecting) return;
      io.disconnect();
      const t0 = performance.now();
      (function step(t) {
        const k = Math.min((t - t0) / 1000, 1);
        n.textContent = Math.round(end * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    });
    io.observe(n);
  });
}

function init(d) {
  renderHead(d);
  const app = document.getElementById("app");
  const main = el("main", {}, [renderHero(d), renderMarquee(d), renderStats(d), renderFolders(d), renderExperience(d), renderSkills(d), renderContact(d)]);
  app.append(el("div", { class: "progress" }), el("div", { class: "cursor-glow" }), renderHeader(d), main, renderFooter(d));
  initNavigation();
  initTyping(d);
  initEffects();
  initReveal();
  initCounters();
}

init(siteData);
</script>
